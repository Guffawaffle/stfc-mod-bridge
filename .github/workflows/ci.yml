name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore STFCCommunityMod.Launcher.sln

      - name: Verify third-party notice inventory
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check

      - name: Test
        run: dotnet test STFCCommunityMod.Launcher.sln -c Release --no-restore

      - name: Publish launcher
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Inspect unsigned package evidence
        shell: pwsh
        run: ./scripts/inspect-package.ps1

      - name: Disposable packaged UI Automation smoke
        shell: pwsh
        timeout-minutes: 5
        run: >-
          ./scripts/smoke-settings.ps1
          -LauncherPath ./artifacts/win-x64/app/STFCCommunityMod.Launcher.exe
          -UseDisposableSyncFixture
          -TimeoutSeconds 60

      - name: Upload installer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stfc-mod-launcher-setup-win-x64
          path: artifacts/win-x64/setup/STFCCommunityMod.Launcher.Setup.exe
          if-no-files-found: error
