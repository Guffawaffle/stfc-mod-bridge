name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore STFCCommunityMod.Launcher.sln

      - name: Verify third-party notice inventory
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check

      - name: Test
        run: dotnet test STFCCommunityMod.Launcher.sln -c Release --no-restore

      - name: Publish Mod Control
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Inspect unsigned package evidence
        shell: pwsh
        run: ./scripts/inspect-package.ps1

      - name: Disposable packaged UI Automation smoke
        shell: pwsh
        timeout-minutes: 5
        run: >-
          ./scripts/smoke-settings.ps1
          -LauncherPath ./artifacts/win-x64/app/STFCModControl.exe
          -UseDisposableSyncFixture
          -TimeoutSeconds 60

      - name: Upload setup evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stfc-mod-control-setup-win-x64
          path: artifacts/win-x64/setup/STFCModControl.Setup.exe
          if-no-files-found: error
