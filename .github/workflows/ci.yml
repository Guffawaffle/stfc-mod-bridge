name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false

      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: "3.0.8"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: src/STFCModBridge.ReleaseVerifier/go.sum

      - name: Restore
        run: dotnet restore STFCCommunityMod.Launcher.sln --locked-mode

      - name: Verify third-party notice inventory
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check

      - name: Build and test closed release verifier
        shell: pwsh
        run: ./scripts/verify-release-verifier.ps1 -RunVulnerabilityAudit

      - name: Build offline TOML before managed tests
        shell: pwsh
        run: ./scripts/build-toml-native.ps1 -OutputDirectory ./artifacts/win-x64/toml-native

      - name: Test
        shell: pwsh
        run: |
          $env:STFC_TOML_NATIVE_TEST_DLL = (Resolve-Path ./artifacts/win-x64/toml-native/stfc-toml-native.dll).Path
          $env:STFC_TOML_NATIVE_TEST_SHA256 = (Get-FileHash $env:STFC_TOML_NATIVE_TEST_DLL -Algorithm SHA256).Hash.ToLowerInvariant()
          dotnet test STFCCommunityMod.Launcher.sln -c Release --no-restore `
            "-p:TomlNativePath=$env:STFC_TOML_NATIVE_TEST_DLL" "-p:TomlNativeSha256=$env:STFC_TOML_NATIVE_TEST_SHA256"

      - name: Publish Mod Bridge
        shell: pwsh
        env:
          SOURCE_REVISION_ID: ${{ github.sha }}
        run: >-
          ./scripts/publish.ps1
          -SourceRevisionId "$env:SOURCE_REVISION_ID"
          -ReleaseVerifierPath ./artifacts/release-verifier/STFCModBridge.ReleaseVerifier.exe
          -TomlNativePath ./artifacts/win-x64/toml-native/stfc-toml-native.dll

      - name: Exercise packaged shared native catalog ABI
        shell: pwsh
        run: |
          $env:STFC_PROFILES_NATIVE_TEST_DLL = (Resolve-Path ./artifacts/win-x64/app/stfc-profiles-native.dll).Path
          $env:STFC_TOML_NATIVE_TEST_DLL = (Resolve-Path ./artifacts/win-x64/app/stfc-toml-native.dll).Path
          $env:STFC_TOML_NATIVE_TEST_SHA256 = (Get-FileHash $env:STFC_TOML_NATIVE_TEST_DLL -Algorithm SHA256).Hash.ToLowerInvariant()
          dotnet test tests/STFCCommunityMod.Launcher.Core.Tests/STFCCommunityMod.Launcher.Core.Tests.csproj -c Release --no-restore --no-build --filter "FullyQualifiedName~NativeProfileCatalogIntegrationTests|FullyQualifiedName~NativeTomlIntegrationTests"

      - name: Inspect unsigned package evidence
        shell: pwsh
        run: ./scripts/inspect-package.ps1

      - name: Qualify disposable development-signed MSIX deployment
        shell: pwsh
        timeout-minutes: 5
        env:
          SOURCE_REVISION_ID: ${{ github.sha }}
        run: >-
          ./scripts/qualify-battle-named-pipe-package.ps1
          -ExpectedSourceRevisionId "$env:SOURCE_REVISION_ID"
          -UseDisposableDevelopmentCertificate

      - name: Disposable packaged UI Automation smoke
        shell: pwsh
        timeout-minutes: 5
        run: >-
          ./scripts/smoke-settings.ps1
          -LauncherPath ./artifacts/win-x64/app/STFCModBridge.exe
          -UseDisposableSyncFixture
          -TimeoutSeconds 60

      - name: Disposable packaged NetniV Settings smoke
        shell: pwsh
        timeout-minutes: 5
        run: >-
          ./scripts/smoke-settings.ps1
          -LauncherPath ./artifacts/win-x64/app/STFCModBridge.exe
          -UseDisposableNetnivFixture
          -TimeoutSeconds 60

      - name: Upload MSIX packaging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-mod-bridge-msix-x64
          path: |
            artifacts/win-x64/package/STFCModBridge.appinstaller
            artifacts/win-x64/package/STFCModBridge.msix
          if-no-files-found: error
