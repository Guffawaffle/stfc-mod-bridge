name: Signed Mod Bridge release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
      release_sequence: ${{ steps.release.outputs.release_sequence }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: src/STFCModBridge.ReleaseVerifier/go.sum

      - name: Resolve and validate tag identity
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ github.sha }}
          RELEASE_SEQUENCE: ${{ github.run_number }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$') {
            throw "Mod Bridge release tags must use vX.Y.Z or vX.Y.Z-rc.N."
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch the protected main branch for release ancestry validation."
          }
          $tagRevision = "refs/tags/$env:RELEASE_TAG" + "^{commit}"
          $eventRevision = $env:TARGET_COMMIT + "^{commit}"
          $tagCommit = (git rev-parse $tagRevision).Trim()
          $eventCommit = (git rev-parse $eventRevision).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $eventCommit) {
            throw "The release event does not resolve to the tagged commit."
          }
          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:RELEASE_TAG' is not reachable from protected main."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-rc.'))" >> $env:GITHUB_OUTPUT
          "commit=$tagCommit" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_SEQUENCE -notmatch '^[1-9][0-9]*$') {
            throw "The GitHub workflow run number is not a positive release sequence."
          }
          "release_sequence=$env:RELEASE_SEQUENCE" >> $env:GITHUB_OUTPUT

      - name: Restore, analyze, and test
        shell: pwsh
        run: |
          dotnet restore STFCCommunityMod.Launcher.sln --locked-mode
          dotnet build STFCCommunityMod.Launcher.sln -c Release --no-restore
          dotnet test STFCCommunityMod.Launcher.sln -c Release --no-restore --no-build

      - name: Build unsigned Mod Bridge payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION_ID: ${{ steps.release.outputs.commit }}
        run: >-
          ./scripts/publish.ps1
          -Version "$env:RELEASE_VERSION"
          -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Upload unsigned Mod Bridge payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-mod-bridge-unsigned-payload-x64
          path: |
            artifacts/win-x64/app
            artifacts/win-x64/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    environment:
      name: windows-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      MOD_BRIDGE_UPDATE_BASE_URI: ${{ vars.MOD_BRIDGE_UPDATE_BASE_URI }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download unsigned Mod Bridge payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-mod-bridge-unsigned-payload-x64
          path: artifacts/win-x64

      - name: Validate protected signing configuration
        shell: pwsh
        run: |
          $required = @(
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_CODE_SIGNING_ACCOUNT_NAME",
            "AZURE_CERTIFICATE_PROFILE_NAME",
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "MOD_BRIDGE_UPDATE_BASE_URI"
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Missing signing environment values: $($missing -join ', ')"
          }

      - name: Azure login with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release verifier first
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\artifacts\win-x64\app\STFCModBridge.ReleaseVerifier.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Mod Bridge
          description-url: https://github.com/Guffawaffle/stfc-mod-bridge

      - name: Rebuild launcher and updater against final signed verifier
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: |
          $source = "artifacts/win-x64/app/STFCModBridge.ReleaseVerifier.exe"
          $retained = "artifacts/win-x64/signed-release-verifier/STFCModBridge.ReleaseVerifier.exe"
          New-Item -ItemType Directory -Path (Split-Path -Parent $retained) -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $retained -Force
          $expected = (Get-FileHash -LiteralPath $retained -Algorithm SHA256).Hash.ToLowerInvariant()
          ./scripts/publish.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -SourceRevisionId "$env:SOURCE_REVISION_ID" `
            -ReleaseVerifierPath $retained
          $actual = (Get-FileHash `
            -LiteralPath "artifacts/win-x64/app/STFCModBridge.ReleaseVerifier.exe" `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
            throw "Rebuilding the paired payload changed the signed release verifier."
          }

      - name: Regenerate verifier SBOM from final signed bytes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: >-
          ./scripts/generate-release-verifier-sbom.ps1
          -BinaryDirectory ./artifacts/win-x64/signed-release-verifier
          -OutputPath ./artifacts/win-x64/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json
          -Version "$env:RELEASE_VERSION"
          -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Restore locked solution for vulnerability audit
        run: dotnet restore STFCCommunityMod.Launcher.sln --locked-mode

      - name: Run final pre-signing security gates
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: >-
          ./scripts/run-release-security-gates.ps1
          -ArtifactDirectory ./artifacts/win-x64/app
          -OutputPath ./artifacts/win-x64/stfc-mod-bridge-pre-signing-sbom.spdx.json
          -Version "$env:RELEASE_VERSION"
          -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Sign paired Mod Bridge launcher and updater
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\artifacts\win-x64\app\STFCModBridge.exe
            ${{ github.workspace }}\artifacts\win-x64\app\STFCModBridge.Updater.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Mod Bridge
          description-url: https://github.com/Guffawaffle/stfc-mod-bridge

      - name: Generate payload SBOM from final signed inner bytes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: >-
          ./scripts/generate-payload-sbom.ps1
          -ArtifactDirectory ./artifacts/win-x64/app
          -OutputPath ./artifacts/win-x64/stfc-mod-bridge-sbom.spdx.json
          -Version "$env:RELEASE_VERSION"
          -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Repackage signed fallback payload and build MSIX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./scripts/package.ps1
          ./scripts/build-msix.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -UpdateBaseUri "$env:MOD_BRIDGE_UPDATE_BASE_URI"

      - name: Sign MSIX package
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: artifacts/win-x64/package
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Mod Bridge MSIX
          description-url: https://github.com/Guffawaffle/stfc-mod-bridge

      - name: Verify every release PE and inspect package boundary
        shell: pwsh
        env:
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: >-
          ./scripts/inspect-package.ps1
          -RequireSignatures
          -ExpectedSourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Verify signed payload with the runtime Authenticode policy
        shell: pwsh
        env:
          STFC_MOD_BRIDGE_SIGNED_RELEASE_ROOT: ${{ github.workspace }}/artifacts/win-x64
        run: |
          dotnet restore tests/STFCCommunityMod.Launcher.Core.Tests/STFCCommunityMod.Launcher.Core.Tests.csproj --locked-mode
          dotnet test tests/STFCCommunityMod.Launcher.Core.Tests/STFCCommunityMod.Launcher.Core.Tests.csproj `
            -c Release `
            --no-restore `
            --filter FullyQualifiedName=STFCCommunityMod.Launcher.Core.Tests.AuthenticodeTrustPolicyTests.OptedInSignedReleasePayloadSatisfiesRuntimePolicy

      - name: Qualify signed Battle named-pipe package boundary
        shell: pwsh
        env:
          SOURCE_REVISION_ID: ${{ needs.build.outputs.commit }}
        run: >-
          ./scripts/qualify-battle-named-pipe-package.ps1
          -ExpectedSourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Resolve authenticated manifest issue time
        id: manifest-time
        shell: pwsh
        run: |
          "issued_at=$([DateTimeOffset]::UtcNow.ToString('yyyy-MM-dd''T''HH:mm:ss''Z'''))" >> $env:GITHUB_OUTPUT

      - name: Generate repository-owned Mod Bridge manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SEQUENCE: ${{ needs.build.outputs.release_sequence }}
          RELEASE_ISSUED_AT: ${{ steps.manifest-time.outputs.issued_at }}
        run: >-
          ./scripts/generate-launcher-release-manifest.ps1
          -Tag "$env:RELEASE_TAG"
          -TargetCommit "$env:TARGET_COMMIT"
          -Repository "$env:RELEASE_REPOSITORY"
          -ReleaseSequence $env:RELEASE_SEQUENCE
          -IssuedAtUtc "$env:RELEASE_ISSUED_AT"

      - name: Attest final signed release subjects
        id: attest-release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/win-x64/app/STFCModBridge.exe
            artifacts/win-x64/app/STFCModBridge.ReleaseVerifier.exe
            artifacts/win-x64/app/STFCModBridge.Updater.exe
            artifacts/win-x64/package/STFCModBridge.msix
            artifacts/win-x64/package/STFCModBridge.appinstaller
            artifacts/win-x64/stfc-mod-bridge-win-x64.zip
            artifacts/win-x64/stfc-mod-bridge-release-manifest.json
            artifacts/win-x64/stfc-mod-bridge-sbom.spdx.json
            artifacts/win-x64/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json

      - name: Attest release-selection manifest only
        id: attest-release-selection
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/win-x64/stfc-mod-bridge-release-manifest.json

      - name: Stage offline attestation bundle
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest-release.outputs.bundle-path }}
          RELEASE_SELECTION_BUNDLE_PATH: ${{ steps.attest-release-selection.outputs.bundle-path }}
        run: |
          if (-not $env:ATTESTATION_BUNDLE_PATH `
              -or -not (Test-Path -LiteralPath $env:ATTESTATION_BUNDLE_PATH -PathType Leaf)) {
            throw "The release attestation action did not produce a bundle."
          }
          if (-not $env:RELEASE_SELECTION_BUNDLE_PATH `
              -or -not (Test-Path -LiteralPath $env:RELEASE_SELECTION_BUNDLE_PATH -PathType Leaf)) {
            throw "The release-selection attestation action did not produce a bundle."
          }
          Copy-Item `
            -LiteralPath $env:ATTESTATION_BUNDLE_PATH `
            -Destination "artifacts/win-x64/stfc-mod-bridge-release-attestation.json" `
            -Force
          Copy-Item `
            -LiteralPath $env:RELEASE_SELECTION_BUNDLE_PATH `
            -Destination "artifacts/win-x64/stfc-mod-bridge-release-selection-attestation.json" `
            -Force

      - name: Upload signed release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-mod-bridge-signed-release-x64
          path: |
            artifacts/win-x64/app/STFCModBridge.exe
            artifacts/win-x64/app/STFCModBridge.ReleaseVerifier.exe
            artifacts/win-x64/app/STFCModBridge.Updater.exe
            artifacts/win-x64/package/STFCModBridge.msix
            artifacts/win-x64/package/STFCModBridge.appinstaller
            artifacts/win-x64/stfc-mod-bridge-win-x64.zip
            artifacts/win-x64/stfc-mod-bridge-release-manifest.json
            artifacts/win-x64/stfc-mod-bridge-release-attestation.json
            artifacts/win-x64/stfc-mod-bridge-release-selection-attestation.json
            artifacts/win-x64/stfc-mod-bridge-sbom.spdx.json
            artifacts/win-x64/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json
          if-no-files-found: error

  stage:
    needs: [build, sign]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          submodules: false

      - name: Download signed release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-mod-bridge-signed-release-x64
          path: artifacts/win-x64

      - name: Verify attested release subjects before draft staging
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $root = "artifacts/win-x64"
          $bundle = "$root/stfc-mod-bridge-release-attestation.json"
          $subjects = @(
            "$root/package/STFCModBridge.msix",
            "$root/package/STFCModBridge.appinstaller",
            "$root/app/STFCModBridge.exe",
            "$root/app/STFCModBridge.ReleaseVerifier.exe",
            "$root/app/STFCModBridge.Updater.exe",
            "$root/stfc-mod-bridge-win-x64.zip",
            "$root/stfc-mod-bridge-release-manifest.json",
            "$root/stfc-mod-bridge-sbom.spdx.json",
            "$root/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json"
          )
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "The signed release payload is missing its attestation bundle."
          }
          foreach ($subject in $subjects) {
            if (-not (Test-Path -LiteralPath $subject -PathType Leaf)) {
              throw "The signed release payload is missing attested subject '$subject'."
            }
            & gh attestation verify $subject `
              --repo $env:RELEASE_REPOSITORY `
              --signer-workflow "$env:RELEASE_REPOSITORY/.github/workflows/release.yml" `
              --source-digest $env:TARGET_COMMIT `
              --source-ref "refs/tags/$env:RELEASE_TAG" `
              --deny-self-hosted-runners `
              --bundle $bundle
            if ($LASTEXITCODE -ne 0) {
              throw "Release attestation verification failed for '$subject'."
            }
          }

      - name: Verify manifest-only release-selection attestation
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $root = "artifacts/win-x64"
          $manifest = "$root/stfc-mod-bridge-release-manifest.json"
          $bundle = "$root/stfc-mod-bridge-release-selection-attestation.json"
          $verificationJson = Join-Path $env:RUNNER_TEMP "release-selection-verification.json"
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "The signed release payload is missing its release-selection attestation bundle."
          }
          & gh attestation verify $manifest `
            --repo $env:RELEASE_REPOSITORY `
            --signer-workflow "$env:RELEASE_REPOSITORY/.github/workflows/release.yml" `
            --source-digest $env:TARGET_COMMIT `
            --source-ref "refs/tags/$env:RELEASE_TAG" `
            --deny-self-hosted-runners `
            --bundle $bundle `
            --format json | Set-Content -LiteralPath $verificationJson -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) {
            throw "Release-selection attestation verification failed."
          }
          ./scripts/verify-release-selection-attestation.ps1 `
            -VerificationJsonPath $verificationJson `
            -SubjectPath $manifest

      - name: Stage App Installer and machine-consumed release inputs as a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $root = "artifacts/win-x64"
          $assets = @(
            "$root/package/STFCModBridge.appinstaller",
            "$root/package/STFCModBridge.msix",
            "$root/stfc-mod-bridge-win-x64.zip",
            "$root/stfc-mod-bridge-release-manifest.json",
            "$root/stfc-mod-bridge-release-attestation.json",
            "$root/stfc-mod-bridge-release-selection-attestation.json",
            "$root/stfc-mod-bridge-sbom.spdx.json",
            "$root/release-verifier/STFCModBridge.ReleaseVerifier.spdx.json"
          )
          $notes = @"
          > [!WARNING]
          > Qualification draft. Do not publish or distribute this release until its canary evidence is complete.

          Install STFC Mod Bridge with `STFCModBridge.appinstaller` after the published-release hosting check succeeds.

          The MSIX, ZIP, manifest, SBOMs, and attestation bundles are machine-consumed trust/update inputs, not alternate installation entry points.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--repo", $env:RELEASE_REPOSITORY,
            "--verify-tag",
            "--draft",
            "--title", "STFC Mod Bridge $env:RELEASE_VERSION",
            "--notes-file", $notesPath
          )
          if ($env:RELEASE_IS_PRERELEASE -eq "True") {
            $arguments += "--prerelease"
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub draft release staging failed."
          }
