name: Signed Mod Bridge release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Resolve and validate tag identity
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$') {
            throw "Mod Bridge release tags must use vX.Y.Z or vX.Y.Z-rc.N."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($Matches.version.Contains('-rc.'))" >> $env:GITHUB_OUTPUT

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore STFCCommunityMod.Launcher.sln
          dotnet test STFCCommunityMod.Launcher.sln -c Release --no-restore

      - name: Build unsigned Mod Bridge payload
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION_ID: ${{ github.sha }}
        run: >-
          ./scripts/publish.ps1
          -Version "$env:RELEASE_VERSION"
          -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Upload unsigned Mod Bridge payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-mod-bridge-unsigned-payload-x64
          path: artifacts/win-x64/app
          if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: windows-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download unsigned Mod Bridge payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-mod-bridge-unsigned-payload-x64
          path: artifacts/win-x64/app

      - name: Validate protected signing configuration
        shell: pwsh
        run: |
          $required = @(
            "WIN_PUBLISHER_NAME",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_CODE_SIGNING_ACCOUNT_NAME",
            "AZURE_CERTIFICATE_PROFILE_NAME"
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Missing signing environment values: $($missing -join ', ')"
          }
          if ($env:WIN_PUBLISHER_NAME -ne "Joseph Gustavson") {
            throw "WIN_PUBLISHER_NAME must match the reviewed Mod Bridge publisher."
          }

      - name: Azure login with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Mod Bridge and updater
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: artifacts/win-x64/app
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Mod Bridge
          description-url: https://github.com/Guffawaffle/stfc-mod-bridge

      - name: Repackage signed payload and rebuild setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION_ID: ${{ github.sha }}
        run: |
          ./scripts/package.ps1
          ./scripts/publish-bootstrapper.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -SourceRevisionId "$env:SOURCE_REVISION_ID"

      - name: Sign setup
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: artifacts/win-x64/setup
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: STFC Mod Bridge Setup
          description-url: https://github.com/Guffawaffle/stfc-mod-bridge

      - name: Verify every release PE and inspect package boundary
        shell: pwsh
        run: >-
          ./scripts/inspect-package.ps1
          -RequireSignatures
          -ExpectedPublisher "$env:WIN_PUBLISHER_NAME"

      - name: Generate repository-owned Mod Bridge manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          ./scripts/generate-launcher-release-manifest.ps1
          -Tag "$env:RELEASE_TAG"
          -TargetCommit "$env:TARGET_COMMIT"
          -Repository "$env:RELEASE_REPOSITORY"

      - name: Attest final signed release subjects
        id: attest-release
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            artifacts/win-x64/app/STFCModBridge.exe
            artifacts/win-x64/app/STFCModBridge.Updater.exe
            artifacts/win-x64/setup/STFCModBridge.Setup.exe
            artifacts/win-x64/stfc-mod-bridge-win-x64.zip
            artifacts/win-x64/stfc-mod-bridge-release-manifest.json

      - name: Stage offline attestation bundle
        shell: pwsh
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest-release.outputs.bundle-path }}
        run: |
          if (-not $env:ATTESTATION_BUNDLE_PATH `
              -or -not (Test-Path -LiteralPath $env:ATTESTATION_BUNDLE_PATH -PathType Leaf)) {
            throw "The release attestation action did not produce a bundle."
          }
          Copy-Item `
            -LiteralPath $env:ATTESTATION_BUNDLE_PATH `
            -Destination "artifacts/win-x64/stfc-mod-bridge-release-attestation.json" `
            -Force

      - name: Upload signed release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-mod-bridge-signed-release-x64
          path: |
            artifacts/win-x64/app/STFCModBridge.exe
            artifacts/win-x64/app/STFCModBridge.Updater.exe
            artifacts/win-x64/setup/STFCModBridge.Setup.exe
            artifacts/win-x64/stfc-mod-bridge-win-x64.zip
            artifacts/win-x64/stfc-mod-bridge-release-manifest.json
            artifacts/win-x64/stfc-mod-bridge-release-attestation.json
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-mod-bridge-signed-release-x64
          path: artifacts/win-x64

      - name: Verify attested release subjects before publication
        shell: pwsh
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          $root = "artifacts/win-x64"
          $bundle = "$root/stfc-mod-bridge-release-attestation.json"
          $subjects = @(
            "$root/setup/STFCModBridge.Setup.exe",
            "$root/app/STFCModBridge.exe",
            "$root/app/STFCModBridge.Updater.exe",
            "$root/stfc-mod-bridge-win-x64.zip",
            "$root/stfc-mod-bridge-release-manifest.json"
          )
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "The signed release payload is missing its attestation bundle."
          }
          foreach ($subject in $subjects) {
            if (-not (Test-Path -LiteralPath $subject -PathType Leaf)) {
              throw "The signed release payload is missing attested subject '$subject'."
            }
            & gh attestation verify $subject `
              --repo $env:RELEASE_REPOSITORY `
              --signer-workflow "$env:RELEASE_REPOSITORY/.github/workflows/release.yml" `
              --source-digest $env:TARGET_COMMIT `
              --source-ref "refs/tags/$env:RELEASE_TAG" `
              --deny-self-hosted-runners `
              --bundle $bundle
            if ($LASTEXITCODE -ne 0) {
              throw "Release attestation verification failed for '$subject'."
            }
          }

      - name: Publish setup and machine-consumed update inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $root = "artifacts/win-x64"
          $assets = @(
            "$root/setup/STFCModBridge.Setup.exe",
            "$root/stfc-mod-bridge-win-x64.zip",
            "$root/stfc-mod-bridge-release-manifest.json",
            "$root/stfc-mod-bridge-release-attestation.json"
          )
          $notes = @"
          Install STFC Mod Bridge with `STFCModBridge.Setup.exe`.

          The ZIP, manifest, and attestation bundle are machine-consumed trust/update inputs, not alternate installation packages.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--repo", $env:RELEASE_REPOSITORY,
            "--verify-tag",
            "--title", "STFC Mod Bridge $env:RELEASE_VERSION",
            "--notes-file", $notesPath
          )
          if ($env:RELEASE_IS_PRERELEASE -eq "True") {
            $arguments += "--prerelease"
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }
