name: Publish App Installer update channel

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: appinstaller-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    environment:
      name: windows-release
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_UPDATE_BUCKET: ${{ vars.GCP_UPDATE_BUCKET }}
      GCP_UPDATE_SERVICE_ACCOUNT: ${{ vars.GCP_UPDATE_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      MOD_BRIDGE_UPDATE_BASE_URI: ${{ vars.MOD_BRIDGE_UPDATE_BASE_URI }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate published release and protected hosting configuration
        id: release
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-rc\.\d+)?)$') {
            throw "Published Mod Bridge tags must use vX.Y.Z or vX.Y.Z-rc.N."
          }
          $releaseVersion = $Matches.version
          $required = @(
            "GCP_PROJECT_ID",
            "GCP_UPDATE_BUCKET",
            "GCP_UPDATE_SERVICE_ACCOUNT",
            "GCP_WORKLOAD_IDENTITY_PROVIDER",
            "MOD_BRIDGE_UPDATE_BASE_URI"
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Missing protected update-hosting values: $($missing -join ', ')"
          }
          $tagRevision = "refs/tags/$env:RELEASE_TAG" + "^{commit}"
          $targetCommit = (git rev-parse $tagRevision).Trim()
          if ($LASTEXITCODE -ne 0 -or $targetCommit -cnotmatch '^[0-9a-f]{40}$') {
            throw "The published release tag does not resolve to a commit."
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "commit=$targetCommit" >> $env:GITHUB_OUTPUT

      - name: Download and verify published release subjects
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          $root = "artifacts/win-x64"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          & gh release download $env:RELEASE_TAG `
            --repo $env:RELEASE_REPOSITORY `
            --dir $root `
            --pattern "STFCModBridge.appinstaller" `
            --pattern "STFCModBridge.msix" `
            --pattern "stfc-mod-bridge-release-attestation.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the published App Installer release subjects."
          }
          $bundle = "$root/stfc-mod-bridge-release-attestation.json"
          foreach ($subject in @("$root/STFCModBridge.appinstaller", "$root/STFCModBridge.msix")) {
            & gh attestation verify $subject `
              --repo $env:RELEASE_REPOSITORY `
              --signer-workflow "$env:RELEASE_REPOSITORY/.github/workflows/release.yml" `
              --source-digest $env:TARGET_COMMIT `
              --source-ref "refs/tags/$env:RELEASE_TAG" `
              --deny-self-hosted-runners `
              --bundle $bundle
            if ($LASTEXITCODE -ne 0) {
              throw "Published release attestation verification failed for '$subject'."
            }
          }

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_UPDATE_SERVICE_ACCOUNT }}

      - name: Set up reviewed Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 565.0.0

      - name: Publish immutable package and advance channel pointer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./scripts/publish-appinstaller-gcs.ps1
          -Bucket "$env:GCP_UPDATE_BUCKET"
          -UpdateBaseUri "$env:MOD_BRIDGE_UPDATE_BASE_URI"
          -Version "$env:RELEASE_VERSION"
          -PackagePath ./artifacts/win-x64/STFCModBridge.msix
          -AppInstallerPath ./artifacts/win-x64/STFCModBridge.appinstaller
