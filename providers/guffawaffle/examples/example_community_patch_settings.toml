[sidecar.sync]
# Dedicated local STFC Mod Sidecar delivery.
# This is the only supported home for sidecar-local HTTP config.
# Local Battle Workbench reads the sidecar event store through /api/events.
# Cloud Sync Monitor and Majel/cloud targets are not required for local sidecar ingest.
enabled = false
token = ""
url = "http://127.0.0.1:43127/api/sidecar/ingest"
proxy = ""
verify_ssl = true
allow_unsafe_tls_without_certificate_validation = false
# Sends raw battle capture events to the local sidecar. With this alone, the
# Workbench may show sparse capture-only battle rows.
battlelogs_realtime = false
# Decodes local sidecar battle journals and emits battle.report,
# catalog.snapshot, and battle.analytics events for Names <-> IDs, catalog
# snapshots, and Prime CSV parity rows. Legacy [battle_log_decoder].enabled is
# accepted as an alias, but this is the canonical local Workbench gate.
battlelog_enrichment = false
fleet_runtime = false
# Fleet runtime sidecar safety/probe mode:
# normal, request_only, snapshot_only, or enqueue_no_transport.
# request_only records requests but skips snapshot reads.
# snapshot_only reads/builds owned snapshots but skips publish/enqueue.
# enqueue_no_transport enqueues latest-wins runtime snapshots but suppresses HTTP transport.
fleet_runtime_mode = "normal"

[sidecar.logging]
# Explicit opt-in local JSONL evidence/import feed for offline review and diagnostics.
# Keep this disabled unless you specifically need local file capture.
jsonl = false
# Keep the local sidecar JSONL feed cyclic so replay does not grow unbounded.
jsonl_replay_seconds = 30
# Optional second cap on retained battle-log groups.
jsonl_recent_logs = 300

[advanced.queue]
# Safely resume the native action queue when authoritative game state proves
# that another player destroyed the exact queued head. Detailed diagnostics
# remain hidden and opt-in; this release-supported protection is enabled by
# default.
thin_queue_protection = true

[advanced.diagnostics]
# Canonical native observability/probing namespace for non-sidecar diagnostics.
# Older [sidecar.probes] and [sidecar.diagnostics] inputs are still accepted as deprecated aliases.
# `debug` and `logging` are dormant compatibility placeholders only in this slice.
# They are not newly active diagnostics controls yet.
# These battle probe keys do not enable normal local Battle Workbench enrichment;
# use [sidecar.sync].battlelog_enrichment for that producer path.
ship_identity = false
battle_log_decoder = false
battle_catalog = false
debug = false
logging = false

# Verbose breadcrumbs for noisy diagnostics. These remain off by default even
# when advanced.diagnostics.debug is enabled.
hotkey_suppression_logging = false
notification_skip_logging = false
fleet_selection_timing_logging = false

# Development-only live query channel for AX. When enabled, `ax debug-send`
# can send one JSON request into the running game and receive a JSON response.
live_query = false

# Emit focused refinery lifecycle, selection, analytics, and purchase-result
# breadcrumbs to the legacy plain-text community_patch.log troubleshooting log.
# Keep disabled during normal play because it detours shared shop/showcase
# methods, adds runtime overhead, and is not the preferred export path.
refinery_diagnostics = false

[advanced.diagnostics.files]
# Optional root directory for the heavier native diagnostics files in this
# slice. Empty preserves the current per-platform locations. When set to a
# usable directory, the navhook trace and action queue probe outputs write
# there.
# Example override for moving high-churn diagnostics off the game directory:
# root = "D:/stfc-diagnostics/native-logs"
root = ""

# Total navhook trace files to keep, including the active file.
# Default keeps about 4 MB per active trace file so one investigation cycle
# does not immediately churn away the evidence.
navhook_trace_max_kb = 4096
navhook_trace_files = 3

# Total action queue probe files to keep, including the active file.
# Default keeps about 8 MB per active JSONL file because structured queue
# traces are denser and usually need more history than the navhook trace.
action_queue_probe_max_kb = 8192
action_queue_probe_files = 3

# Science-only queue repair and Kir'shara investigation settings are maintained
# in example_science_patch_settings.toml so the normal release example only
# advertises production/user-ready surfaces.

